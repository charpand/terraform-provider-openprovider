name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer push to a pull request cancels the older run; on
# main and on tags every commit runs to completion, so each one is scanned and
# a release is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency and code scanning by Snyk runs through the Snyk GitHub App
# (`security/snyk` and `code/snyk` commit statuses), not in this workflow.

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Go and golangci-lint at the versions in mise.toml / mise.lock, the same
      # ones `./scripts/lint` uses locally.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go golangci-lint

      - name: Run lints
        run: ./scripts/lint

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

  test:
    timeout-minutes: 30
    name: test
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go node

      - name: Run tests
        run: ./scripts/test

  docs:
    # Docs are only re-validated for the code they're generated from; the
    # commit backing a release tag was already validated when it landed on main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 10
    name: docs
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go terraform

      - name: Generate docs
        run: ./scripts/docs

      - name: Validate docs
        run: go tool tfplugindocs validate --provider-name openprovider

      # `git status` also reports new files, such as the page of a resource
      # whose generated docs were never committed; `git diff` would miss those.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain -- docs/ templates/)" ]; then
            git status --short -- docs/ templates/
            git diff -- docs/ templates/
            echo "::error::Documentation is out of date. Please run './scripts/docs' and commit the changes."
            exit 1
          fi

  sbom:
    # Scanned on PRs and main; the tagged commit was already scanned, and the
    # release job publishes the SBOMs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 15
    name: sbom
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Go toolchain is part of what is scanned (its standard library is
      # linked into the binary), so build with the pinned release version.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go

      # Scan the compiled provider rather than the repository: the SBOM then
      # contains only what ships, not `tool` dependencies, test helpers or the
      # mock tooling.
      - name: Build provider
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/terraform-provider-openprovider .

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: build/terraform-provider-openprovider
          # Trivy's CycloneDX decoder rejects the 1.7 that syft writes by default.
          format: cyclonedx-json@1.6
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  trivy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: sbom
    timeout-minutes: 15
    name: trivy
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cdx.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  grype:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: sbom
    timeout-minutes: 15
    name: grype
    runs-on: craci
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          cache-db: true

  release:
    # Only cut a release once lint and test have confirmed the tagged commit is good.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    timeout-minutes: 30
    name: release
    runs-on: craci
    permissions:
      contents: write
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          image: default
          size: "2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: '0'
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$FINGERPRINT" ]; then
            echo "Failed to extract GPG fingerprint" >&2
            exit 1
          fi
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          # .goreleaser.yaml is a `version: 2` config; stay on that major.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
