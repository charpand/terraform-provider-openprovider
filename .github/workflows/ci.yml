name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer push to a pull request cancels the older run; on
# main and on tags every commit runs to completion, so a release is never cut
# off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scanning lives in security.yml.

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-26.04-arm
    steps:
      # Records the job's network egress (audit mode) as the baseline for a
      # later allowlist.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Go and golangci-lint at the versions in mise.toml / mise.lock, the same
      # ones `./scripts/lint` uses locally.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false # see the release job
          install_args: go golangci-lint

      - name: Run lints
        run: ./scripts/lint

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Fails if a module in the download cache differs from go.sum.
      - name: Verify module checksums
        run: go mod verify

  test:
    timeout-minutes: 30
    name: test
    runs-on: ubuntu-26.04-arm
    steps:
      # Records the job's network egress (audit mode) as the baseline for a
      # later allowlist.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false # see the release job
          install_args: go node

      - name: Run tests
        run: ./scripts/test

  docs:
    # Docs are only re-validated for the code they're generated from; the
    # commit backing a release tag was already validated when it landed on main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 10
    name: docs
    runs-on: ubuntu-26.04-arm
    steps:
      # Records the job's network egress (audit mode) as the baseline for a
      # later allowlist.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false # see the release job
          install_args: go terraform

      - name: Generate docs
        run: ./scripts/docs

      - name: Validate docs
        run: go tool tfplugindocs validate --provider-name openprovider

      # `git status` also reports new files, such as the page of a resource
      # whose generated docs were never committed; `git diff` would miss those.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain -- docs/ templates/)" ]; then
            git status --short -- docs/ templates/
            git diff -- docs/ templates/
            echo "::error::Documentation is out of date. Please run './scripts/docs' and commit the changes."
            exit 1
          fi

  release:
    # Only cut a release once lint and test have confirmed the tagged commit is good.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    timeout-minutes: 30
    name: release
    runs-on: ubuntu-26.04-arm
    # Holds the signing secrets (GPG_PRIVATE_KEY, PASSPHRASE): only tag builds
    # can use them, and the environment can require a manual approval.
    environment: release
    permissions:
      contents: write
      id-token: write # keyless signing of the build provenance (Sigstore)
      attestations: write # store the provenance attestation
    steps:
      # Records the job's network egress (audit mode) as the baseline for a
      # later allowlist.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: '0'
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # No cache: this workflow publishes releases, and a cache written by an
          # earlier run (main is readable from tag builds) must not be able to
          # influence what ships.
          cache: false
          install_args: go

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$FINGERPRINT" ]; then
            echo "Failed to extract GPG fingerprint" >&2
            exit 1
          fi
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          # .goreleaser.yaml is a `version: 2` config; stay on that major.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}

      # Signed SLSA build provenance for every archive listed in the checksum
      # file, tying each artifact to this workflow run and commit. Verify with
      #   gh attestation verify <archive> --repo charpand/terraform-provider-openprovider
      - name: Locate checksum file
        id: checksums
        run: |
          file="$(ls dist/*_SHA256SUMS)"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.file }}
