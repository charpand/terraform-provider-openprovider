name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: craci
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: cracicorp/setup@v1
        with:
          template: default
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      - name: Run lints
        run: |
          # Run existing linter script
          ./scripts/lint
          # Also run go vet to catch additional suspicious code patterns
          go vet ./...

  test:
    timeout-minutes: 30
    name: test
    runs-on: craci
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: cracicorp/setup@v1
        with:
          image: default
          size: 2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test

  docs:
    # Docs are only re-validated for the code they're generated from; the
    # commit backing a release tag was already validated when it landed on main.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: docs
    runs-on: craci
    concurrency:
      group: ci-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: cracicorp/setup@v1
        with:
          image: default
          size: 2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Generate docs
        run: ./scripts/docs

      - name: Validate docs
        run: go tool tfplugindocs validate --provider-name openprovider

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code docs/ templates/; then
            echo "::error::Documentation is out of date. Please run './scripts/docs' and commit the changes."
            exit 1
          fi

  sbom:
    # Scanned on PRs and main; the tagged commit was already scanned, and the
    # release job publishes the SBOMs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 15
    name: sbom
    runs-on: ubuntu-26.04-arm
    concurrency:
      group: ci-sbom-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      # Scan the compiled provider rather than the repository: the SBOM then
      # contains only what ships, not `tool` dependencies, test helpers or the
      # Prism/Node mock tooling.
      - name: Build provider
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/terraform-provider-openprovider .

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: build/terraform-provider-openprovider
          # Trivy's CycloneDX decoder rejects the 1.7 that syft writes by default.
          format: cyclonedx-json@1.6
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  trivy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: sbom
    timeout-minutes: 15
    name: trivy
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.cdx.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  grype:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: sbom
    timeout-minutes: 15
    name: grype
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          cache-db: true

  snyk:
    timeout-minutes: 15
    name: snyk
    # Fork PRs and Dependabot/Renovate runs have no access to SNYK_TOKEN.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') }}
    # snyk/actions/setup always installs the x64 CLI, so this job cannot use the
    # ARM runners of the other jobs.
    runs-on: ubuntu-26.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Dependencies of the provider module (go.mod).
      - name: Snyk open source
        run: snyk test --file=go.mod --severity-threshold=high

      # Static analysis of this repository's own Go code. Runs even when the
      # dependency scan found something, so one run reports both.
      - name: Snyk code
        if: ${{ !cancelled() }}
        run: snyk code test --severity-threshold=high

  release:
    # Only cut a release once lint and test have confirmed the tagged commit is good.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    name: release
    runs-on: craci
    permissions:
      contents: write
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: cracicorp/setup@v1
        with:
          template: default

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: '0'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$FINGERPRINT" ]; then
            echo "Failed to extract GPG fingerprint" >&2
            exit 1
          fi
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
        id: import_gpg

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
