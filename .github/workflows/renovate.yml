name: Renovate

on:
  schedule:
    # Weekdays at 17:00 UTC
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
      dryRun:
        description: Dry run (no branches/PRs created)
        type: boolean
        default: false
      repoCache:
        description: Repository cache
        type: choice
        options: [enabled, disabled, reset]
        default: enabled
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/renovate-global.json5
      - .github/workflows/renovate.yml

# Deny everything by default; the job grants only what it needs
permissions: {}

# Never run two Renovate instances against the repo at once
concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived, repo-scoped token from a dedicated GitHub App (preferred over a PAT)
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Restore Renovate cache
        id: cache-restore
        if: inputs.repoCache != 'disabled' && inputs.repoCache != 'reset'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      # Renovate runs as uid 12021 inside its container
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          configurationFile: .github/renovate-global.json5
          token: ${{ steps.get_token.outputs.token }}
          renovate-version: 44.115.7
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}

      - name: Save Renovate cache
        if: inputs.repoCache != 'disabled' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
