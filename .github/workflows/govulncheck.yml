name: govulncheck

# Reports known vulnerabilities (Go vulnerability database) that the provider
# actually reaches through its call graph. Complements Trivy/Grype/Snyk, which
# match on module versions alone. Also runs on a schedule: new advisories
# appear without any commit to this repository.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    timeout-minutes: 10
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...
